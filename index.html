<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#121316">
<title>Montaje</title>
<style>
:root{
  --bg:#121316; --panel:#1b1d22; --panel2:#24272e; --line:#30343c;
  --text:#e8e9ec; --dim:#9aa0aa; --accent:#f5b33d; --vid:#4a7fd4; --mus:#3fae7a; --danger:#e5604f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;min-height:40px;padding:0 13px;cursor:pointer;touch-action:manipulation}
button:active{background:#30343c}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.icon{padding:0;width:42px;display:inline-grid;place-items:center}
button.danger{color:var(--danger)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 10px 0 2px;letter-spacing:.02em}
header .spacer{flex:1}
header label{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:6px}
.stagewrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#0b0c0e}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;overflow:hidden;border-radius:4px}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.stage video.on{opacity:1}
#o2,#o3{background:#000}   /* V2/V3 tapan todo el cuadro, igual que en la exportación */
.stage .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px}
.transport{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line)}
.tc{font:600 17px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;min-width:118px}
.mark{font:700 12px/1 system-ui;letter-spacing:.3px}
.tc small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:3px}
.transport .spacer{flex:1}
#play{width:52px}
#tlwrap{position:relative;background:var(--panel);touch-action:none}
#tl{display:block;width:100%;height:222px}
.inspector{min-height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel2);border-top:1px solid var(--line);flex-wrap:wrap}
.inspector .name{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspector .meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.inspector .grp{display:flex;gap:6px;align-items:center}
.inspector .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.inspector input[type=range]{width:110px;accent-color:var(--accent)}
.hint{color:var(--dim);font-size:13px}
#gfx{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.inspector textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;width:210px;min-height:40px;resize:vertical;user-select:text;-webkit-user-select:text}
.inspector button.swatch{width:34px;min-height:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--line)}
.inspector button.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.inspector input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:3px}
.inspector button.on{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:#000d;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;z-index:50;pointer-events:none;transition:opacity .2s}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:40;padding:16px}
.modal.open{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%)}
.card h2{margin:0 0 14px;font-size:18px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:12px}
.card .row span{color:var(--dim)}
.card .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{color:var(--dim);font-size:12.5px;margin-top:10px}
#xv{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;bottom:0}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <h1>Montaje</h1>
  <button id="addVid"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Video</button>
  <button id="addMus"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Música</button>
  <button id="addTxt"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg> Texto</button>
  <button id="undo" class="icon" title="Deshacer" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <div class="spacer"></div>
  <label>Formato
    <select id="aspect">
      <option value="16:9">16:9</option><option value="9:16">9:16</option>
      <option value="1:1">1:1</option><option value="4:5">4:5</option><option value="4:3">4:3</option>
    </select>
  </label>
  <button id="export" class="primary" disabled>Exportar</button>
</header>

<div class="stagewrap"><div class="stage" id="stage">
  <video id="vA" playsinline preload="auto"></video>
  <video id="vB" playsinline preload="auto"></video>
  <video id="o2" playsinline preload="auto"></video>
  <video id="o3" playsinline preload="auto"></video>
  <canvas id="gfx"></canvas>
  <div class="empty" id="empty">Agregá videos con <b>&nbsp;+ Video&nbsp;</b>.<br>Se ubican uno detrás del otro en el orden en que los elijas.</div>
</div></div>
<audio id="aud" preload="auto"></audio>

<div class="transport">
  <div class="tc" id="tc">00:00:00:00<small id="tcd">/ 00:00:00:00</small></div>
  <div class="spacer"></div>
  <button class="icon" id="prevCut" title="Corte anterior"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></svg></button>
  <button class="icon" id="stepB" title="Cuadro anterior"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="icon primary" id="play" title="Reproducir"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button>
  <button class="icon" id="stepF" title="Cuadro siguiente"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <button class="icon" id="nextCut" title="Corte siguiente"><svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg></button>
  <button class="icon mark" id="mIn" title="Marcar entrada (I)">IN</button>
  <button class="icon mark" id="mOut" title="Marcar salida (O)">OUT</button>
  <div class="spacer"></div>
  <button class="icon" id="zOut" title="Alejar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg></button>
  <button class="icon" id="zFit" title="Ver todo"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="icon" id="zIn" title="Acercar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-4.3-4.3"/></svg></button>
</div>

<div id="tlwrap"><canvas id="tl"></canvas></div>
<div class="inspector" id="insp"></div>

<div class="modal" id="exModal"><div class="card" id="exCard"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>
<video id="xv" playsinline muted preload="auto"></video>
<input type="file" id="fVid" accept="video/*" multiple>
<input type="file" id="fMus" accept="audio/*,video/*">

function grp(){ const d = document.createElement('div'); d.className = 'grp'; return d; }
function sep(){ const d = document.createElement('div'); d.className = 'sep'; return d; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function volCtl(val, set){
  const d = grp(); const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 1.5; r.step = .01; r.value = val;
  const lab = document.createElement('span'); lab.className = 'meta'; const upd = () => lab.textContent = 'Vol ' + Math.round(r.value * 100) + '%'; upd();
  r.onpointerdown = () => pushUndo(); r.oninput = () => { set(+r.value); upd(); };
  d.append(lab, r); return d;
}
function nudge(n){ pushUndo(); music.offset = snapFrame(music.offset + n / fps); afterEdit(); if (!playing) previewAt(playhead); }
function trimIn(c){
  const st = clipStart(c); pushUndo(); c.in = snapFrame(c.in + (playhead - st));
  if (c.track) c.start = snapFrame(playhead); else playhead = st;
  afterEdit();
}
function trimOut(c){ const st = clipStart(c); pushUndo(); c.out = snapFrame(c.in + (playhead - st)); afterEdit(); }
function split(c){
  const st = clipStart(c), cut = snapFrame(c.in + (playhead - st));
  if (cut - c.in < 1 / fps || c.out - cut < 1 / fps) return;
  pushUndo(); const b = {...c, id: uid++, in: cut}; c.out = cut;
  if (c.track){ b.start = st + (cut - c.in); over.push(b); } else clips.splice(clips.indexOf(c) + 1, 0, b); selection = {type: 'clip', id: b.id}; afterEdit();
}
function moveClip(c, d){ const i = clips.indexOf(c), j = i + d; if (j < 0 || j >= clips.length) return; pushUndo(); clips.splice(i, 1); clips.splice(j, 0, c); afterEdit(); }
function afterEdit(){
  tidy(); over = over.filter(c => clipDur(c) >= .5 / fps); layoutTL();
  playhead = Math.min(playhead, total());
  if (markIn != null && markIn > total()) markIn = null;
  if (markOut != null && markOut > total()) markOut = total();
  $('export').disabled = !total(); $('empty').style.display = clips.length || over.length ? 'none' : '';
  if (playing){ cur = null; vA.pause(); vB.pause(); o2.pause(); o3.pause(); }
  updInspector(); updTC(); drawTL(); if (!playing) previewAt(playhead);
}
function setMark(which){
  const t = snapFrame(playhead);
  if (which === 'in') markIn = (markIn != null && Math.abs(markIn - t) < 1e-6) ? null : t;   // tocar de nuevo en el mismo cuadro la borra
  else markOut = (markOut != null && Math.abs(markOut - t) < 1e-6) ? null : t;
  selection = null; updInspector(); drawTL();
}
const markRange = () => [markIn != null ? markIn : 0, Math.min(total(), markOut != null ? markOut : total())];
// Saca lo que está entre IN y OUT. ripple = true junta el resto; si no, deja un hueco negro del mismo largo.
function removeRange(ripple){
  const [a, b] = markRange(); if (b - a < 0.5 / fps) return;
  pushUndo();
  const out = []; let s = 0, gapDone = false;
  for (const c of clips){
    const d = clipDur(c), cs = s, ce = s + d; s = ce;
    if (ce <= a + 1e-6 || cs >= b - 1e-6){ out.push(c); continue; }
    if (cs < a) out.push({...c, out: c.in + (a - cs)});
    if (!gapDone){ gapDone = true; if (!ripple) out.push({id: uid++, media: null, in: 0, out: b - a, vol: 0}); }
    if (ce > b) out.push({...c, id: uid++, in: c.in + (b - cs)});
  }
  clips = out; markIn = markOut = null; selection = null; playhead = a;
  afterEdit(); toast(ripple ? 'Sacado y juntado' : 'Sacado, quedó negro');
}
// junta huecos contiguos y descarta pedazos de menos de medio cuadro
function tidy(){
  const out = [];
  for (const c of clips){
    if (clipDur(c) < 0.5 / fps) continue;
    const p = out[out.length - 1];
    if (!c.media && p && !p.media){ p.out += clipDur(c); continue; }
    out.push(c);
  }
  clips = out;
}
function cutPoints(self){
  const s = starts(), p = [...s.filter((_, i) => clips[i] !== self), v1Total(), total()];
  for (const c of over) if (c !== self) p.push(c.start, c.start + clipDur(c));
  return [...new Set(p)].sort((a, b) => a - b);
}

const RES = {'1080': 1080, '720': 720};
function outSize(aspectStr, short){
  const [a, b] = aspectStr.split(':').map(Number); let w, h;
  if (a >= b){ h = short; w = short * a / b; } else { w = short; h = short * b / a; }
  const even = n => Math.round(n / 2) * 2; return [even(w), even(h)];
}
async function pickVideoCodec(w, h, f, bitrate){
  const cands = [['avc1.640034', 'avc'], ['avc1.640028', 'avc'], ['avc1.4d0028', 'avc'], ['avc1.42e028', 'avc'], ['vp09.00.40.08', 'vp9']];
  for (const [codec, kind] of cands){
    const cfg = {codec, width: w, height: h, bitrate, framerate: f, latencyMode: 'quality'};
    if (kind === 'avc') cfg.avc = {format: 'avc'};
    try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported) return {cfg, kind}; } catch (e){}
  }
  return null;
}
async function pickAudioCodec(){
  for (const [codec, kind] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]){
    const cfg = {codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000};
    try { const s = await AudioEncoder.isConfigSupported(cfg); if (s.supported) return {cfg, kind}; } catch (e){}
  }
  return null;
}
let exportState = null;

  <div class="row"><span>Calidad</span><select id="xQ"><option value="1.4">Alta</option><option value="1" selected>Normal</option><option value=".6">Liviana</option></select></div>

// Video aplanado: en cada tramo se ve solo el clip de la pista más alta (V3 > V2 > V1).
function segments(){
  const T = total(), st = starts(), pts = new Set([0, T]);
  clips.forEach((c, i) => { pts.add(st[i]); pts.add(st[i] + clipDur(c)); });
  over.forEach(c => { pts.add(c.start); pts.add(c.start + clipDur(c)); });
  const ts = [...pts].filter(t => t >= 0 && t <= T).sort((a, b) => a - b), segs = [];
  for (let k = 0; k < ts.length - 1; k++){
    const a = ts[k], b = ts[k + 1]; if (b - a < 1e-6) continue;
    const m = (a + b) / 2; let c = overAt(3, m) || overAt(2, m), cs = c ? c.start : 0;
    if (!c && m < v1Total()){ const r = clipAt(m); c = r.c; cs = r.start; }
    const seg = c && c.media ? {media: c.media, in: c.in + (a - cs), out: c.in + (b - cs), src: c} : {media: null, in: 0, out: b - a, src: null};
    const p = segs[segs.length - 1];
    if (p && p.src === seg.src){ p.out += seg.out - seg.in; continue; }
    segs.push(seg);
  }
  return segs;
}
async function runExport(short, F, q){
  const [w, h] = outSize(aspect, short);
  const bitrate = Math.round(w * h * F * 0.09 * q);
  const vc = await pickVideoCodec(w, h, F, bitrate), ac = await pickAudioCodec();
  if (!vc){ alert('No encontré un codificador de video compatible en este dispositivo.'); return; }
  const c = $('exCard');
  c.innerHTML = `<h2>Exportando…</h2><div class="bar"><i id="xBar"></i></div><div class="meta" id="xMsg">Preparando</div>
    <div class="actions"><button id="xStop">Cancelar</button></div>`;
  const st = exportState = {cancel: false};
  $('xStop').onclick = () => { st.cancel = true; };
  let wake = null; try { wake = await navigator.wakeLock?.request('screen'); } catch (e){}
  const setP = (p, msg) => { $('xBar').style.width = (p * 100).toFixed(1) + '%'; if (msg) $('xMsg').textContent = msg; };
  try {
    const T = total(), N = Math.round(T * F);
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: {codec: vc.kind, width: w, height: h, frameRate: F},
      audio: ac ? {codec: ac.kind, numberOfChannels: 2, sampleRate: 48000} : undefined,
      fastStart: 'in-memory', firstTimestampBehavior: 'offset'
    });
    // --- audio ---
    if (ac){
      setP(0, 'Mezclando audio…');
      const SR = 48000, len = Math.max(1, Math.ceil(T * SR));
      const oc = new OfflineAudioContext(2, len, SR);
      let s = 0;
      for (const cl of clips){
        const d = clipDur(cl);
        if (cl.media && cl.media.buffer && cl.vol > 0){
          const src = oc.createBufferSource(); src.buffer = cl.media.buffer;
          const gn = oc.createGain(); gn.gain.value = cl.vol; src.connect(gn).connect(oc.destination);
          src.start(s, cl.in, d);
        }
        s += d;
      }
      for (const cl of over){
        if (!cl.media.buffer || cl.vol <= 0) continue;
        const src = oc.createBufferSource(); src.buffer = cl.media.buffer;
        const gn = oc.createGain(); gn.gain.value = cl.vol; src.connect(gn).connect(oc.destination);
        src.start(cl.start, cl.in, clipDur(cl));
      }
      if (music && music.vol > 0){
        const src = oc.createBufferSource(); src.buffer = music.media.buffer;
        const gn = oc.createGain(); gn.gain.value = music.vol; src.connect(gn).connect(oc.destination);
        if (music.offset >= 0) src.start(music.offset, 0); else src.start(0, -music.offset);
      }
      const mix = await oc.startRendering();
      if (st.cancel) throw new Error('cancel');
      let aerr = null;
      const aenc = new AudioEncoder({output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: e => aerr = e});
      aenc.configure(ac.cfg);
      const L0 = mix.getChannelData(0), R0 = mix.getChannelData(1), CH = 4800;
      for (let i = 0; i < mix.length; i += CH){
        const n = Math.min(CH, mix.length - i), data = new Float32Array(n * 2);
        data.set(L0.subarray(i, i + n), 0); data.set(R0.subarray(i, i + n), n);
        const ad = new AudioData({format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / SR * 1e6), data});
        aenc.encode(ad); ad.close();
        if (aenc.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 5));
      }
      await aenc.flush(); aenc.close();
      if (aerr) throw aerr;
    }
    // --- video ---
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    const cx = canvas.getContext('2d', {alpha: false});
    // el video se dibuja en "base"; cada cuadro codificado = base + textos en su tiempo exacto
    const base = document.createElement('canvas'); base.width = w; base.height = h;
    const bx = base.getContext('2d', {alpha: false});
    let verr = null;
    const venc = new VideoEncoder({output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => verr = e});
    venc.configure(vc.cfg);
    let n = 0;
    const encodeUntil = (endIdx, upToT) => {
      while (n < endIdx && n / F <= upToT + 0.5 / F){
        cx.drawImage(base, 0, 0); drawTexts(cx, w, h, n / F);
        const fr = new VideoFrame(canvas, {timestamp: Math.round(n * 1e6 / F), duration: Math.round(1e6 / F)});
        venc.encode(fr, {keyFrame: n % (F * 2) === 0}); fr.close(); n++;
      }
    };
    const drawV = v => {
      bx.fillStyle = '#000'; bx.fillRect(0, 0, w, h);
      const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return;
      const s = Math.min(w / vw, h / vh), dw = vw * s, dh = vh * s;
      bx.drawImage(v, (w - dw) / 2, (h - dh) / 2, dw, dh);
    };
    const xv = $('xv');
    let start = 0;
    const segs = segments();
    for (let ci = 0; ci < segs.length; ci++){
      const cl = segs[ci], d = clipDur(cl), endIdx = Math.round((start + d) * F);
      if (st.cancel) throw new Error('cancel');
      setP(n / N, `Video: tramo ${ci + 1} de ${segs.length}`);
      if (!cl.media){ bx.fillStyle = '#000'; bx.fillRect(0, 0, w, h); encodeUntil(endIdx, start + d + 1); start += d; continue; }
      if (xv.src !== cl.media.url) await loadMeta(xv, cl.media.url);
      await seekTo(xv, cl.in);
      drawV(xv);
      await new Promise((resolve, reject) => {
        let done = false, lastFrameAt = performance.now();
        const finish = () => {
          if (done) return; done = true; clearInterval(wd); xv.pause();
          encodeUntil(endIdx, start + d + 1); resolve();
        };
        const onFrame = async (now, meta) => {
          if (done) return;
          lastFrameAt = performance.now();
          if (st.cancel){ done = true; clearInterval(wd); xv.pause(); reject(new Error('cancel')); return; }
          if (verr){ done = true; clearInterval(wd); reject(verr); return; }
          const mt = meta.mediaTime;
          if (mt >= cl.out - 0.25 / F){ finish(); return; }
          drawV(xv);
          encodeUntil(endIdx, start + (mt - cl.in));
          setP(n / N, `Video: ${fmtShort(n / F)} de ${fmtShort(T)}`);
          if (venc.encodeQueueSize > 6){
            xv.pause();
            while (venc.encodeQueueSize > 2) await new Promise(r => setTimeout(r, 10));
            if (!done) xv.play().catch(()=>{});
          }
          xv.requestVideoFrameCallback(onFrame);
        };
        xv.requestVideoFrameCallback(onFrame);
        xv.onended = finish;
        const wd = setInterval(() => {
          if (done) return;
          if (xv.currentTime >= cl.out - 0.05 || xv.ended){ finish(); return; }
          if (performance.now() - lastFrameAt > 4000){ lastFrameAt = performance.now(); xv.play().catch(()=>{}); }
        }, 500);
        xv.play().catch(e => { done = true; clearInterval(wd); reject(e); });
      });
      start += d;
    }
    xv.onended = null;
    setP(.995, 'Terminando archivo…');
    await venc.flush(); venc.close();
    if (verr) throw verr;
    muxer.finalize();
    const blob = new Blob([muxer.target.buffer], {type: 'video/mp4'});
    showDone(blob, w, h, F, vc, ac);
  } catch (e){
    console.error(e);
    if (e.message === 'cancel') $('exModal').classList.remove('open');
    else { $('exCard').innerHTML = `<h2>No se pudo exportar</h2><p class="meta">${esc(String(e.message || e))}</p><div class="actions"><button onclick="document.getElementById('exModal').classList.remove('open')">Cerrar</button></div>`; }
  } finally { try { wake && wake.release(); } catch (e){} }
}
function showDone(blob, w, h, F, vc, ac){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `montaje-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.mp4`;
  const file = new File([blob], name, {type: 'video/mp4'});
  const url = URL.createObjectURL(blob);
  const canShare = navigator.canShare && navigator.canShare({files: [file]});
  $('exCard').innerHTML = `<h2>Listo</h2>
    <div class="row"><span>Archivo</span><b>${name}</b></div>
    <div class="row"><span>Tamaño</span><b>${(blob.size / 1048576).toFixed(1)} MB</b></div>
    <div class="row"><span>Video</span><b>${w}×${h} · ${F} cps · ${vc.kind === 'avc' ? 'H.264' : 'VP9'}</b></div>
    <div class="row"><span>Audio</span><b>${ac ? (ac.kind === 'aac' ? 'AAC' : 'Opus') + ' estéreo' : 'sin audio'}</b></div>
    <div class="actions"><button id="dClose">Cerrar</button>${canShare ? '<button id="dShare">Compartir…</button>' : ''}<a id="dDl" download="${name}" href="${url}"><button class="primary">Guardar</button></a></div>
    <p class="note">“Guardar” lo deja en Descargas. “Compartir” te deja mandarlo directo a Google Fotos u otra app.</p>`;
  $('dClose').onclick = () => { $('exModal').classList.remove('open'); };
  if (canShare) $('dShare').onclick = () => navigator.share({files: [file], title: name}).catch(()=>{});
